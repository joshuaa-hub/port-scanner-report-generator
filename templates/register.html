<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Port Scanner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1320;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            padding: 40px;
            background: #111827;
            border: 1px solid #26364f;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: #8da4c7;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background: #090f19;
            border: 1px solid #30415d;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2d70b7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3984d0;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #8da4c7;
        }

        a {
            color: #42a5ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CREATE ACCOUNT</h1>

        <p class="subtitle">Secure Network Analysis Platform</p>

        <form method="POST" action="/register">

            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="you@example.com"
                   required>

          <div class="input-group">
    <label>Password</label>

    <div class="password-box">
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >
        <button type="button" onclick="togglePassword('password', this)">👁</button>
    </div>
</div>

<div class="input-group">
    <label>Confirm Password</label>

    <div class="password-box">
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >
        <button type="button" onclick="togglePassword('confirm_password', this)">👁</button>
    </div>
</div>

            <button type="submit">
                🔐 CREATE ACCOUNT
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/">Login</a>
        </div>

    </div>

</body>
</html>
